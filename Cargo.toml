[package]
name = "axon-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
# keep-sorted start

]}
# Web framework for SSE endpoint
axum = { version = "0.8", features = ["macros"] }
color-eyre = "0.6.5"
# Utilities
dashmap = "6"           # Concurrent hashmap for registry
dotenvy = "0.15"
futures = "0.3"
http = "1"              # HTTP types for custom headers
kameo = "0.13"
# Observability
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
# Caching
moka = { version = "0.12", features = ["future"] }
notify = "7"            # File watching for hot reload
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# MCP protocol
rmcp = { version = "0.17.0", features = [
    "client",
    "server",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "schemars",
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Auth & Security
subtle = "2"            # Constant-time comparison for auth tokens
thiserror = "2"
# Async runtime
tokio = { version = "1", features = ["full"] }
# Config
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }  # For request IDs

# keep-sorted end
