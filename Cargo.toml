[package]
name = "axon-gateway"
version = "0.3.2"
edition = "2024"
rust-version = "1.96.1"
license = "MIT"
description = "A high-performance MCP gateway that aggregates multiple Model Context Protocol servers behind a single endpoint"
repository = "https://github.com/Mozart409/axon-gateway"
homepage = "https://github.com/Mozart409/axon-gateway"
authors = ["Mozart409"]
keywords = ["mcp", "gateway", "model-context-protocol", "proxy", "aggregator"]
categories = ["network-programming", "web-programming"]

[dependencies]
# keep-sorted start
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
color-eyre = "0.6.5"
dashmap = "6"
dotenvy = "0.15"
futures = "0.3"
http = "1"
kameo = "0.22.1"
maud = "0.27"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
moka = { version = "0.12", features = ["future"] }
notify = "8"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = { version = "3.0", features = [
    "client",
    "macros",
    "schemars",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
 ] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1.1"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

# keep-sorted end

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rstest = "0.26"
tempfile = "3"
