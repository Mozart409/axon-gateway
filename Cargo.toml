[package]
name = "axon-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# MCP protocol
rmcp = { version = "0.17.0", features = [
    "client",
    "server",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "schemars",
]}

kameo = "0.13"

# Web framework for SSE endpoint
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
toml = "0.8"

# Utilities
dashmap = "6"           # Concurrent hashmap for registry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
futures = "0.3"
color-eyre = "0.6.5"
notify = "7"            # File watching for hot reload
uuid = { version = "1", features = ["v4"] }  # For request IDs
