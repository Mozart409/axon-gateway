[package]
name = "axon-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# MCP protocol
rmcp = { version = "0.1", features = ["client", "server", "transport-sse", "transport-http"] }

# Actor framework (your preference)
kameo = "0.13"

# Web framework for SSE endpoint
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
toml = "0.8"

# Utilities
dashmap = "6"           # Concurrent hashmap for registry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
