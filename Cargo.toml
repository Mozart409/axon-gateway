[package]
name = "axon-gateway"
version = "0.5.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT"
description = "A high-performance MCP gateway that aggregates multiple Model Context Protocol servers behind a single endpoint"
repository = "https://github.com/Mozart409/axon-gateway"
homepage = "https://github.com/Mozart409/axon-gateway"
authors = ["Mozart409"]
keywords = ["mcp", "gateway", "model-context-protocol", "proxy", "aggregator"]
categories = ["network-programming", "web-programming"]

[dependencies]
# keep-sorted start
async-trait = "0.1"
axum ={ version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
color-eyre = "0.6.5"
dashmap = "6"
dotenvy = "0.15"
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
http = "1"
ipnet = "2"
# OIDC: oauth2 for the authorization URL, PKCE and code exchange, jsonwebtoken
# for the ID token signature on aws-lc (already in the tree through rustls), so
# without the `rsa` crate (RUSTSEC-2023-0071). Never enable its `rust_crypto`
# feature. Same stack as rust/lanternd.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
kameo = "0.22.2"
maud = "0.27"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
moka = { version = "0.12", features = ["future"] }
notify = "8"
oauth2 = { version = "5", default-features = false }
# opentelemetry* must match the version tracing-opentelemetry links against
# (0.34 -> opentelemetry 0.33). Bump them together, never independently.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "internal-logs"] }
# `reqwest-blocking-client`: without an HTTP client feature, `http/protobuf`
# fails to build ("no HTTP client is configured") and tracing silently turns
# off. Blocking, because the batch span processor exports from its own thread
# with no tokio runtime. `reqwest-rustls` verifies via rustls-platform-verifier,
# i.e. the system trust store, so a step-ca root in the mounted bundle works.
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "internal-logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "rt-tokio", "internal-logs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
ring = "0.17"
rmcp = { version = "3.4", features = [
    "client",
    "macros",
    "schemars",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
 ] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
subtle = "2"
thiserror = "2"
# Cookie `Max-Age` is a `time::Duration` in the cookie crate axum-extra uses.
time = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1.1"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
# keep-sorted end

[dev-dependencies]
# Tests only: the mock identity provider signs ID tokens with these.
aws-lc-rs = "1"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rstest = "0.27"
tempfile = "3"

# Pedantic is on for every build, not only via CI flags. Test code is exempt
# from the panic-family denies through `clippy.toml`.
[lints.clippy]
# keep-sorted start
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
unused_async_trait_impl = "allow" # kameo/rmcp handlers are written `async fn` by convention
unwrap_in_result = "deny"
unwrap_used = "deny"
# keep-sorted end
