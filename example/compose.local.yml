# Dev only: Postgres and a mock OIDC provider for a gateway run on the host
# (`bacon run-long`). The mock logs every login in as `dev`, a member of
# `axon-admins`, so no seed data is needed. It sets each token's `aud` from
# the token exchange `audience`, else the `resource` indicator, else the
# client id.
services:
  postgres:
    image: docker.io/library/postgres:19rc2-alpine
    environment:
      POSTGRES_USER: axon
      POSTGRES_PASSWORD: axon-dev
      POSTGRES_DB: axon
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - axon-dev-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axon -d axon"]
      interval: 5s
      timeout: 5s
      retries: 10
  mockoidc:
    image: ghcr.io/navikt/mock-oauth2-server:latest
    ports:
      - "127.0.0.1:4011:8080"
    environment:
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "audience",
                  "match": "*",
                  "claims": {
                    "sub": "dev",
                    "aud": ["$${audience}"],
                    "name": "Dev User",
                    "preferred_username": "dev",
                    "email": "dev@axon.test",
                    "email_verified": true,
                    "groups": ["axon-admins"]
                  }
                },
                {
                  "requestParam": "resource",
                  "match": "*",
                  "claims": {
                    "sub": "dev",
                    "aud": ["$${resource}"],
                    "name": "Dev User",
                    "preferred_username": "dev",
                    "email": "dev@axon.test",
                    "email_verified": true,
                    "groups": ["axon-admins"]
                  }
                },
                {
                  "requestParam": "grant_type",
                  "match": "*",
                  "claims": {
                    "sub": "dev",
                    "aud": ["$${client_id}"],
                    "name": "Dev User",
                    "preferred_username": "dev",
                    "email": "dev@axon.test",
                    "email_verified": true,
                    "groups": ["axon-admins"]
                  }
                }
              ]
            }
          ]
        }
volumes:
  axon-dev-pgdata:
