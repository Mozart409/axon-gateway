# Lefthook configuration for Rust project
# https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true
    - name: clippy
      glob: "*.rs"
      run: cargo clippy --all-targets -- -D warnings
      stage_fixed: true
    - name: keep-sorted
      run: keep-sorted {staged_files}
      stage_fixed: true
pre-push:
  parallel: true
  jobs:
    - name: test
      run: cargo test
    - name: clippy-pedantic
      glob: "*.rs"
      run: cargo clippy -- -W clippy::pedantic
    - name: keep-sorted-check
      run: keep-sorted --check .
