# Lefthook configuration for Rust project
# https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    # keep-sorted start
    - name: cargo-deny
      run: cargo deny check
    - name: cargo-fix
      glob: "*.rs"
      run: cargo fix --allow-dirty --allow-staged
      stage_fixed: true
    - name: clippy
      run: cargo clippy --all-targets -- -D warnings -D clippy::pedantic
    - name: format
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true
    - name: keep-sorted
      run: keep-sorted {staged_files}
      stage_fixed: true
      # keep-sorted end 
commit-msg:
  parallel: true
  jobs:
    # keep-sorted start
    - name: cog
      run: cog verify --file {1}
      # keep-sorted end
pre-push:
  parallel: true
  jobs:
    # keep-sorted start
    - name: clippy-pedantic
      glob: "*.rs"
      run: cargo clippy -- -D clippy::pedantic
    - name: podman-build
      run: just oci-build
    - name: test
      run: cargo test
  # keep-sorted end 
