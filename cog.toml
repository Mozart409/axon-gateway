from_latest_tag = false
ignore_merge_commits = true
ignore_fixup_commits = false
tag_prefix = "v"
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
branch_whitelist = []
pre = "alpha.*"
skip_ci = "[skip ci]"
skip_untracked = false
pre_bump_hooks = [
    # Sync the [package] version in Cargo.toml to the version cog computed,
    # then refresh the lockfile entry. cog stages and commits both files as
    # part of the bump commit.
    "cargo set-version --package axon-gateway {{version}}",
    "cargo update --offline --package axon-gateway --precise {{version}}",
]
post_bump_hooks = []
pre_package_bump_hooks = []
post_package_bump_hooks = []

[git_hooks]

[commit_types]
release = { changelog_title = "Releases" }

[changelog]
path = "CHANGELOG.md"
authors = []

[bump_profiles]
