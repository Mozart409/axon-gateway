# Default values for the axon-gateway chart.

# Replicas share sessions, rate limits and policy through the database, so no
# session affinity is needed. Several replicas need database mode
# (`database.enabled`); standalone, sessions live in each process and you must
# run 1.
replicaCount: 2

image:
  repository: ghcr.io/mozart409/axon-gateway
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Database mode: the gateway reads no config file. Backends, toolsets, OIDC
# providers and settings are stored in Postgres and managed in the dashboard
# and the API; only the settings below are environment. `config` is ignored
# and no config ConfigMap is created or mounted. Needs kek.existingSecret.
database:
  enabled: false
  # Secret holding the Postgres URL (becomes AXON_DATABASE_URL). Required when
  # enabled.
  existingSecret: ""
  key: url

# Public URL of the gateway (AXON_BASE_URL), used for OIDC redirects and
# links. Required in database mode.
baseUrl: ""
# Listen address (AXON_BIND). Keep the port in step with service.port's target:
# the container port is 8080.
bind: "0.0.0.0:8080"
# AXON_ALLOW_STDIO. A process spawned inside the pod is not a boundary you want
# on Kubernetes; run the server in its own Deployment behind a bridge instead.
allowStdio: false

# Optional bootstrap OIDC provider for database mode (AXON_OIDC_*). Without any
# provider, log in with `axon-gateway admin login-link` and add one in the
# dashboard. It is shown there as read-only (source env).
oidc:
  issuer: ""            # setting it turns the bootstrap provider on
  clientId: ""          # required with the issuer
  id: ""                # default "sso"
  displayName: ""
  adminGroups: []       # members of these groups are admins
  # The client secret is mounted from a Secret as a file
  # (AXON_OIDC_CLIENT_SECRET_FILE). Leave empty for a public PKCE client.
  clientSecret:
    existingSecret: ""
    key: client-secret

# One-shot import of a config.toml into the database (database mode only): a
# pre-install,pre-upgrade hook Job runs
#   axon-gateway admin import-config /config/config.toml
# (always with --no-tokens). Off by default.
#   - The file wins: every install and upgrade with this on overwrites what was
#     changed in the dashboard. Turn it off after the first run.
#   - The file may hold secrets, so it lives in a Secret (mounted 0400), never
#     a ConfigMap. Give it inline as `config` (the chart renders the Secret) or
#     keep it out of the values with `existingSecret`; exactly one of the two.
#   - `[[tokens]]` entries become service accounts WITHOUT a token, so no token
#     reaches a pod log. Issue tokens in the dashboard (Admin -> Service
#     accounts) or via the API afterwards.
#   - The Job and the rendered Secret are deleted when the Job succeeds; a
#     failed Job is kept for an hour (`kubectl logs
#     job/<release>-axon-gateway-import`).
#   - `${VAR}` references resolve from existingSecret / env / envFrom.
import:
  enabled: false
  dryRun: false         # report only, write nothing
  config: ""            # the config.toml text; or existingSecret
  existingSecret: ""    # name of a Secret that holds the config.toml
  existingSecretKey: config.toml

# Standalone mode (database.enabled false): the whole config.toml, rendered
# into a ConfigMap and mounted read-only at
# /etc/axon/config.toml (AXON_GATEWAY_CONFIG points there). `${VAR}` references
# are resolved from the container environment when the file is loaded, so put
# secrets in `existingSecret` / `env`, never here.
#
# No checksum annotation covers this ConfigMap on purpose: the gateway watches
# the file and hot-reloads it, so editing `config` does not restart the pods
# (the kubelet takes up to a minute to refresh the mounted file). Keep
# `[gateway] allow_stdio` off: a process spawned inside the pod is not a
# boundary you want on Kubernetes.
config: |
  [gateway]
  bind = "0.0.0.0:8080"
  base_url = "https://axon.example.com"
  allow_stdio = false

  # [[backends]]
  # name = "docs"
  # url = "https://mcp.example.com/mcp"
  # transport = "http"
  # enabled = true

# Name of an existing Secret whose keys all become environment variables
# (OIDC client secrets, backend tokens for `${VAR}` references, ...; in
# standalone mode also AXON_DATABASE_URL). The Secret is
# read at start; after changing it run `kubectl rollout restart`.
existingSecret: ""

# Extra environment (list of EnvVar) and envFrom (list of EnvFromSource).
# OTLP tracing uses the standard OTEL_* variables, for example
#   - name: OTEL_EXPORTER_OTLP_ENDPOINT
#     value: http://otel-collector.observability.svc:4317
env: []
envFrom: []

# RUST_LOG filter and JSON log lines (AXON_LOG_JSON=1).
logLevel: info
logJson: true

# Key-encryption key; required in database mode, where it seals the secrets of
# backends, OIDC providers, personal servers and catalog credentials. A
# standalone gateway does not use it. The Secret key is mounted as a file and AXON_KEK_FILE points at it. Format: one line per
# KEK, `[id:]secret`, a secret of at least 32 characters.
kek:
  existingSecret: ""
  key: kek

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# The image runs as nonroot (65532) and only reads /app and its config.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# SSE streams are long-lived. On shutdown the pod first sits in preStop (so the
# endpoint is removed from Services and the Gateway), then gets SIGTERM and
# finishes in-flight calls; the grace period must exceed both.
preStopSleepSeconds: 10
terminationGracePeriodSeconds: 60

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Created only when replicaCount > 1 (minAvailable 1 by default).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Gateway API route (gateway.networking.k8s.io/v1). There is no Ingress.
httpRoute:
  enabled: false
  annotations: {}
  # Required when enabled, for example:
  #   - name: public-gateway
  #     namespace: gateway-system
  #     sectionName: https
  parentRefs: []
  hostnames: []
  path: /
  # Optional, for long SSE streams: { request: 0s } disables the request timeout
  # on implementations that support it.
  timeouts: {}

# Needs the Prometheus Operator CRDs.
serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  interval: 30s
  scrapeTimeout: 10s

# Alert rules from files/prometheus-rules.yaml (same as
# example/observability/prometheus-rules.yaml).
prometheusRule:
  enabled: false
  namespace: ""
  labels: {}
  # Scrape job used by AxonGatewayDown. The ServiceMonitor job is the Service
  # name, which is the default here.
  job: ""

# ConfigMap labelled grafana_dashboard=1 for the Grafana sidecar, from
# files/grafana-dashboard.json.
grafanaDashboard:
  enabled: false
  namespace: ""
  # Sets the grafana_folder annotation (sidecar folder-from-annotation setups).
  folder: ""

nodeSelector: {}
tolerations: []
affinity: {}
# Example: spread replicas over nodes.
#   - maxSkew: 1
#     topologyKey: kubernetes.io/hostname
#     whenUnsatisfiable: ScheduleAnyway
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/name: axon-gateway
topologySpreadConstraints: []
