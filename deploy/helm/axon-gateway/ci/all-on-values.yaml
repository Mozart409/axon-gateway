# Every optional feature on, for `helm template` in `just axon-deploy-check`.
replicaCount: 3

# Database mode: no config ConfigMap, everything through environment.
database:
  enabled: true
  existingSecret: axon-gateway-db
  key: url

baseUrl: https://axon.example.com
bind: "0.0.0.0:8080"
allowStdio: false

oidc:
  issuer: https://id.example.com
  clientId: axon
  id: sso
  displayName: Example SSO
  adminGroups:
    - axon-admins
  clientSecret:
    existingSecret: axon-gateway-oidc
    key: client-secret

# The one-shot import hook, with a config that uses a ${VAR} reference.
import:
  enabled: true
  dryRun: true
  config: |
    [gateway]
    rate_limit_per_minute = 100

    [[backends]]
    name = "docs"
    url = "https://mcp.example.com/mcp"
    transport = "http"
    enabled = true
    auth_token = "${DOCS_TOKEN}"

existingSecret: axon-gateway-env

env:
  - name: RUST_LOG
    value: info
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://otel-collector.observability.svc:4317

envFrom:
  - secretRef:
      name: axon-gateway-extra

kek:
  existingSecret: axon-gateway-kek
  key: kek

serviceAccount:
  create: true
  annotations:
    example.com/owner: platform

podAnnotations:
  example.com/scrape: "true"

podDisruptionBudget:
  enabled: true

httpRoute:
  enabled: true
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - axon.example.com

serviceMonitor:
  enabled: true
  labels:
    release: prometheus

prometheusRule:
  enabled: true
  labels:
    release: prometheus

grafanaDashboard:
  enabled: true
  folder: Axon
