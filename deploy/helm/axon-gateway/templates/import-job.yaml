{{- if .Values.import.enabled }}
{{- if not .Values.database.enabled }}
{{- fail "import.enabled needs database.enabled: the import writes into the database" }}
{{- end }}
{{- $_ := required "kek.existingSecret is required when import.enabled" .Values.kek.existingSecret }}
{{- $inline := .Values.import.config }}
{{- $existing := .Values.import.existingSecret }}
{{- if and $inline $existing }}
{{- fail "import.config and import.existingSecret are mutually exclusive: set exactly one" }}
{{- end }}
{{- if not (or $inline $existing) }}
{{- fail "import.enabled needs the file to import: set import.config (the config.toml text) or import.existingSecret" }}
{{- end }}
{{- $configKey := .Values.import.existingSecretKey | default "config.toml" }}
{{- /*
  One-shot import of a config.toml (admin import-config). The file holds
  secrets (backend tokens, client secrets), so it goes in a Secret, mounted
  0400, never a ConfigMap. The Job runs with --no-tokens: [[tokens]] entries
  become service accounts without a token, so no token ever reaches a pod log.
  Both objects are Helm hooks, so the Secret exists before the Job on a first
  install, and both are deleted once the Job succeeded. A failed Job stays for
  debugging until its TTL. The import runs before the Deployment is rolled, so
  a new version's migrations run here first.
*/}}
{{- if $inline }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "axon-gateway.fullname" . }}-import
  labels:
    {{- include "axon-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  config.toml: |
    {{- $inline | nindent 4 }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "axon-gateway.fullname" . }}-import
  labels:
    {{- include "axon-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  # Only a failed Job is left behind (hook-succeeded deletes the rest): an hour
  # to read its log
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      # Not the selector labels of the Deployment: the Service must not route to
      # this pod.
      labels:
        app.kubernetes.io/name: {{ include "axon-gateway.name" . }}-import
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: import
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - admin
            - import-config
            - /config/config.toml
            - --no-tokens
            {{- if .Values.import.dryRun }}
            - --dry-run
            {{- end }}
          env:
            {{- include "axon-gateway.databaseUrlEnv" . | nindent 12 }}
            - name: AXON_KEK_FILE
              value: /etc/axon-kek/{{ .Values.kek.key }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.existingSecret .Values.envFrom }}
          envFrom:
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: kek
              mountPath: /etc/axon-kek
              readOnly: true
      volumes:
        - name: config
          secret:
            {{- if $inline }}
            secretName: {{ include "axon-gateway.fullname" . }}-import
            {{- else }}
            secretName: {{ $existing }}
            {{- end }}
            defaultMode: 0400
            items:
              - key: {{ if $inline }}config.toml{{ else }}{{ $configKey }}{{ end }}
                path: config.toml
        - name: tmp
          emptyDir: {}
        - name: kek
          secret:
            secretName: {{ .Values.kek.existingSecret }}
            defaultMode: 0400
            items:
              - key: {{ .Values.kek.key }}
                path: {{ .Values.kek.key }}
{{- end }}
