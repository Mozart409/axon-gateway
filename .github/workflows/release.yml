name: Release Images

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (defaults to ref name)
        required: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/${{ matrix.arch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/${{ matrix.arch }} image
        run: >-
          docker buildx build
          --platform linux/${{ matrix.arch }}
          --file Dockerfile
          --tag ${IMAGE_NAME}:${RELEASE_TAG}-${{ matrix.arch }}
          --push
          .

  publish-manifest:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --tag ${IMAGE_NAME}:${RELEASE_TAG} \
            --tag ${IMAGE_NAME}:latest \
            ${IMAGE_NAME}:${RELEASE_TAG}-amd64 \
            ${IMAGE_NAME}:${RELEASE_TAG}-arm64
          docker buildx imagetools inspect ${IMAGE_NAME}:${RELEASE_TAG}
