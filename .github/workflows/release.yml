name: Release Images
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
permissions:
  contents: read
  packages: write
jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.set-tag.outputs.release_tag }}
    steps:
      - id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              echo "tag input required" >&2
              exit 1
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.set-tag.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

  build-and-push:
    needs: prepare-release
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release-tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/${{ matrix.arch }} image
        run: >-
          docker buildx build --platform ${{ matrix.platform }} --file Dockerfile --tag ${IMAGE_NAME}:${RELEASE_TAG}-${{ matrix.arch }} --push .
  publish-manifest:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-and-push
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release-tag }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --tag ${IMAGE_NAME}:${RELEASE_TAG} \
            --tag ${IMAGE_NAME}:latest \
            ${IMAGE_NAME}:${RELEASE_TAG}-amd64 \
            ${IMAGE_NAME}:${RELEASE_TAG}-arm64
          docker buildx imagetools inspect ${IMAGE_NAME}:${RELEASE_TAG}
