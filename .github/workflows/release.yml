name: Release Images
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  packages: write
jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.set-tag.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              echo "tag input required" >&2
              exit 1
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.set-tag.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

  build-container:
    needs: prepare-release
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v5

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          outputs: type=docker,dest=container-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Upload container image
        uses: actions/upload-artifact@v5
        with:
          name: container-${{ matrix.arch }}
          path: container-${{ matrix.arch }}.tar
          retention-days: 1

  publish-manifest:
    needs:
      - prepare-release
      - build-container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download container images
        uses: actions/download-artifact@v5
        with:
          pattern: container-*

      - name: Log in to GHCR
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          REPO_RAW: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release-tag }}
        run: |
          buildah manifest create axon-gateway
          buildah manifest add axon-gateway docker-archive:container-amd64/container-amd64.tar
          buildah manifest add axon-gateway docker-archive:container-arm64/container-arm64.tar

          for TAG in "${RELEASE_TAG}" "latest"; do
            buildah manifest push --all axon-gateway "docker://ghcr.io/${REPO_RAW,,}:${TAG}"
          done
