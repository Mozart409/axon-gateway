name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  tests-and-lints:
    name: Cargo Tests & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Run tests
        run: cargo test --locked

      - name: Run clippy (pedantic)
        run: cargo clippy --all-targets --locked -- -W clippy::pedantic
