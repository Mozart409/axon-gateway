name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests, Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy (pedantic, warnings denied)
        run: cargo clippy --all-targets --locked -- -D warnings -D clippy::pedantic

      - name: Run tests
        run: cargo test --locked

  supply-chain:
    name: Audit & Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: Run cargo deny
        run: cargo deny check

      - name: Run cargo audit
        run: cargo audit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage summary
        run: cargo llvm-cov --locked --summary-only

  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.96
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.96"

      - name: Check against MSRV
        run: cargo check --locked --all-targets
