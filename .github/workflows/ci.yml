name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  tests-and-lints:
    name: Cargo Tests & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Run clippy (pedantic)
        run: cargo clippy --all-targets --locked -- -W clippy::pedantic
