# MCP Gateway Configuration
#
# This config defines which MCP servers to aggregate and how to connect to them.

# Optional Postgres store. The URL is read from the named environment variable,
# never from this file. Migrations run at startup; changes need a restart.
# [database]
# url_env = "AXON_DATABASE_URL"  # default

# Dashboard login through OIDC providers, listed on the login page in this
# order. Needs [database]; changes need a restart. Register
# `{gateway.base_url}/auth/callback` as the redirect URI at each provider.
# [[auth.oidc]]
# id = "entra"  # [a-z0-9-]+
# display_name = "Microsoft"
# issuer = "https://login.microsoftonline.com/<tenant-id>/v2.0"
# client_id = "<application-client-id>"
# client_secret_env = "AXON_OIDC_ENTRA_SECRET"  # unset for a public (PKCE) client
# admin_groups = ["<group-object-id>"]
#
# [[auth.oidc]]
# id = "pocket-id"
# issuer = "https://id.homelab.internal"
# client_id = "<client-id>"
# scopes = ["openid", "profile", "email", "groups"]  # default without "groups"
# groups_claim = "groups"  # default; a dotted path reaches into objects
# admin_groups = ["admins"]
# allowed_email_domains = ["example.com"]  # empty = any

# RBAC for multi-user mode: groups, tool grants and role bindings. Groups,
# grants and bindings can also be managed at runtime through the dashboard API;
# the ones declared here are read-only there. Everyone logged in is in the
# built-in group "authenticated".
# [[rbac.groups]]
# name = "it"  # [a-z0-9_-]+
# description = "IT staff"
# idp = [{ provider = "pocket-id", value = "it-staff" }]  # claim value -> member
#
# [[rbac.grants]]
# group = "it"  # a declared group or "authenticated"
# backend = "files"
# include = ["*"]  # default; tool globs
# exclude = ["delete_*"]
# read_only = false  # only tools with readOnlyHint pass
# mandatory = false  # users cannot hide these tools
#
# [[rbac.role_bindings]]
# role = "auditor"  # admin | backend-admin | auditor | member
# group = "it"

[gateway]
# Address to bind the gateway server
bind = "0.0.0.0:8080"
# Public base URL used to render MCP endpoint links
base_url = "http://localhost:8080"

# Optional: simple shared Bearer token auth
# auth_token = "your-secret-token-here"
# auth_token = "${AXON_GATEWAY_TOKEN}"  # from .env or process env

# Optional: global rate limit, in requests per minute per token.
# Default: 0 (unlimited) — rate limiting is off until you set a non-zero value.
# Uses a fixed 1-minute window per token. A per-token `rate_limit_per_minute`
# (see [[tokens]] below) overrides this global default.
# Note: simple shared `auth_token` auth is NOT rate-limited; use named tokens.
# rate_limit_per_minute = 0

# --- Backend MCP Servers ---
# Each backend gets a namespace prefix for its tools.
# e.g., homeassistant's "turn_on" becomes "homeassistant_turn_on"

[[backends]]
name = "homeassistant"
url = "http://localhost:3001/mcp/sse"
transport = "sse"
enabled = true

[[backends]]
name = "jellyfin"
url = "http://localhost:3002/mcp"
transport = "http"
enabled = true

[[backends]]
name = "proxmox"
url = "http://localhost:3003/mcp/sse"
transport = "sse"
enabled = true

# Example: stdio-based MCP server (local binary)
# [[backends]]
# name = "filesystem"
# command = "/usr/local/bin/mcp-filesystem"
# args = ["--root", "/data"]
# transport = "stdio"
# enabled = true

# Example: disabled backend (kept for reference)
# [[backends]]
# name = "experimental"
# url = "http://localhost:9999/mcp"
# transport = "http"
# enabled = false

# Example: backend with tool filtering
# [[backends]]
# name = "docker"
# url = "http://localhost:3004/mcp"
# transport = "http"
# allowed_tools = ["list_containers", "get_logs"]  # only expose these
# enabled = true

# Example: backend with auth token forwarding
# [[backends]]
# name = "secure-api"
# url = "http://localhost:3005/mcp"
# transport = "http"
# auth_token = "backend-secret-token"  # forwarded as Bearer token
# auth_token = "${SECURE_API_TOKEN}"  # from .env or process env
# enabled = true

# Example: backend with custom environment variables (stdio)
# [[backends]]
# name = "local-tool"
# command = "/usr/local/bin/mcp-tool"
# transport = "stdio"
# env = { API_KEY = "key123", DEBUG = "true" }
# env = { API_KEY = "${OPENAI_API_KEY}", DEBUG = "true" }
# enabled = true

# --- Named API Tokens with Permissions ---
# Define multiple tokens with different access levels

# Example: agent with full access
# [[tokens]]
# name = "claude-agent"
# token = "tok_claude_abc123"
# token = "${CLAUDE_AGENT_TOKEN}"
# # allowed_tools = []  # empty = all tools
# # allowed_backends = []  # empty = all backends
# # rate_limit_per_minute = 0  # 0 = use global default

# Example: restricted agent
# [[tokens]]
# name = "limited-agent"
# token = "tok_limited_xyz789"
# allowed_tools = ["homeassistant_*", "jellyfin_search"]
# allowed_backends = ["homeassistant", "jellyfin"]
# rate_limit_per_minute = 60

# --- Toolsets ---
# Expose subsets of tools via different endpoints.
# Access via POST /mcp/toolset/{name}
# List toolsets via GET /status/toolsets
# Deprecated aliases: [[groups]], /mcp/group/{name} and /status/groups
# ("groups" now means RBAC groups); removed after one minor release.

# Example: home automation toolset
# [[toolsets]]
# name = "home"
# description = "Home automation tools"
# backends = ["homeassistant"]
# # tools = []  # empty = all tools from allowed backends

# Example: media toolset with specific tools
# [[toolsets]]
# name = "media"
# description = "Media management tools"
# tools = ["jellyfin_*"]
# backends = ["jellyfin"]

# Example: all tools (useful for giving different auth to different toolsets)
# [[toolsets]]
# name = "all"
# description = "All available tools"
# # backends = []  # empty = all backends
# # tools = []  # empty = all tools
